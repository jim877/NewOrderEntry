<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Clipboard body -->
  <rect x="45" y="40" width="110" height="140" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="3"/>
  <!-- Clipboard clip -->
  <rect x="72" y="30" width="56" height="20" rx="6" fill="#94a3b8" stroke="#475569" stroke-width="2.5"/>
  <circle cx="100" cy="40" r="5" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>

  <!-- House outline on clipboard -->
  <path d="M100 72 L130 95 L130 130 L70 130 L70 95 Z" fill="#dbeafe" stroke="#3b82f6" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Roof -->
  <path d="M65 98 L100 68 L135 98" fill="none" stroke="#3b82f6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Door -->
  <rect x="91" y="110" width="18" height="20" rx="2" fill="#93c5fd" stroke="#3b82f6" stroke-width="2"/>
  <circle cx="105" cy="121" r="2" fill="#3b82f6"/>
  <!-- Window -->
  <rect x="76" y="98" width="12" height="10" rx="1.5" fill="#bfdbfe" stroke="#3b82f6" stroke-width="1.5"/>
  <line x1="82" y1="98" x2="82" y2="108" stroke="#3b82f6" stroke-width="1"/>
  <line x1="76" y1="103" x2="88" y2="103" stroke="#3b82f6" stroke-width="1"/>

  <!-- Checkmarks -->
  <path d="M72 140 L78 146 L88 136" stroke="#22c55e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M72 152 L78 158 L88 148" stroke="#22c55e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Lines (text placeholders) -->
  <line x1="94" y1="141" x2="128" y2="141" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="94" y1="153" x2="120" y2="153" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Magnifying glass overlay -->
  <circle cx="148" cy="52" r="18" fill="white" stroke="#0ea5e9" stroke-width="3"/>
  <circle cx="148" cy="52" r="12" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="2"/>
  <line x1="160" y1="64" x2="172" y2="76" stroke="#0ea5e9" stroke-width="4" stroke-linecap="round"/>
  <!-- Eye in magnifier -->
  <ellipse cx="148" cy="52" rx="7" ry="4.5" fill="none" stroke="#0284c7" stroke-width="1.5"/>
  <circle cx="148" cy="52" r="2.5" fill="#0284c7"/>
</svg>